<!doctype html>
<html lang="en" data-composition-variables='[
  {"id":"src","type":"string","label":"Screenshot","default":"site.png"},
  {"id":"url","type":"string","label":"Address","default":"example.com"},
  {"id":"y","type":"number","label":"Vertical centre","default":0.3},
  {"id":"seconds","type":"number","label":"Seconds","default":3}
]'>
<head>
<meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
  #root { position: relative; width: 100%; height: 100%; font-family: -apple-system, "SF Pro Text", system-ui, sans-serif; }
  .win { position: absolute; left: 50%; width: 900px; border-radius: 24px; overflow: hidden; background: #fff;
         box-shadow: 0 40px 100px -24px rgba(0,0,0,.7); }
  .bar { height: 64px; background: #eceef3; display: flex; align-items: center; gap: 10px; padding: 0 22px; }
  .dot { width: 16px; height: 16px; border-radius: 50%; }
  .addr { margin-left: 18px; flex: 1; height: 38px; border-radius: 10px; background: #fff; color: #5b6275; font-size: 22px; display: flex; align-items: center; padding: 0 16px; }
  .view { height: 560px; overflow: hidden; }
  .view img { width: 100%; display: block; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="3" data-width="1080" data-height="1920">
  <div class="win clip" id="win" data-start="0" data-duration="3">
    <div class="bar"><i class="dot" style="background:#ff5f57"></i><i class="dot" style="background:#febc2e"></i><i class="dot" style="background:#28c840"></i><div class="addr" id="addr"></div></div>
    <div class="view"><img id="shot" alt=""></div>
  </div>
</div>
<script>
  const v = window.__hyperframes.getVariables();
  const dur = Number(v.seconds) || 3;
  document.getElementById('root').dataset.duration = dur; document.getElementById('win').dataset.duration = dur;
  const win = document.getElementById('win');
  win.style.top = (Number(v.y) * 1920) + 'px';
  document.getElementById('addr').textContent = String(v.url).replace(/^https?:\/\//, '').replace(/\/$/, '');
  const shot = document.getElementById('shot'); shot.src = v.src;
  gsap.set(win, { xPercent: -50, yPercent: -50, x: 0 });
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(win, { y: 300, scale: .9, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: .5, ease: 'expo.out' }, 0);
  // a slow scroll down the page, the way someone would show a site
  tl.fromTo(shot, { y: 0 }, { y: -260, duration: dur - 1, ease: 'sine.inOut' }, .5);
  tl.to(win, { y: 200, opacity: 0, duration: .3, ease: 'power2.in' }, dur - .3);
  window.__timelines['main'] = tl;
  tl.seek(0);
</script>
</body>
</html>
